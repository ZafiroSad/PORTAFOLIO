<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propuesta A · Cortinas — STICK INDUSTRIES</title>
<style>
/* =================================================================
   PROPUESTA A — REVELADO POR CORTINAS
   La pantalla arranca cerrada por franjas verticales que se retiran
   en cascada, como un telon. Detras aparece el render, que nunca deja
   de moverse (Ken Burns lento). El texto entra por lineas, cada una
   emergiendo desde debajo de una mascara invisible.

   Curva de animacion: cubic-bezier(.16,1,.3,1) — arranca rapido y
   frena suave. Es la que usan las interfaces que se sienten caras.
   ================================================================= */
:root {
  --fondo: #08080a;
  --texto: #fafafa;
  --tenue: #a1a1aa;
  --salida: cubic-bezier(.16, 1, .3, 1);
  --fuente: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--fondo); color: var(--texto); font-family: var(--fuente); overflow-x: hidden; }

.escena { position: relative; height: 100svh; min-height: 560px; overflow: hidden; }

/* --- Imagen de fondo con deriva permanente --------------------- */
.lienzo { position:absolute; inset:0; overflow:hidden; }
.lienzo img {
  width:100%; height:100%; object-fit:cover;
  transform: scale(1.16);
  animation: deriva 22s ease-in-out infinite alternate;
}
@keyframes deriva {
  from { transform: scale(1.16) translate(0, 0); }
  to   { transform: scale(1.26) translate(-2.2%, -1.6%); }
}

.velo {
  position:absolute; inset:0;
  background: linear-gradient(to top,
    rgba(8,8,10,.93) 0%, rgba(8,8,10,.5) 38%, rgba(8,8,10,.02) 68%, rgba(8,8,10,.5) 100%);
}

/* --- El telon: seis franjas que suben en cascada ---------------- */
.telon { position:absolute; inset:0; display:flex; z-index:5; pointer-events:none; }
.franja {
  flex:1; background: var(--fondo);
  transform: translateY(0);
  animation: subir 1.25s var(--salida) forwards;
}
/* El retraso escalonado es lo que convierte seis rectangulos en un gesto */
.franja:nth-child(1) { animation-delay: .15s }
.franja:nth-child(2) { animation-delay: .24s }
.franja:nth-child(3) { animation-delay: .33s }
.franja:nth-child(4) { animation-delay: .42s }
.franja:nth-child(5) { animation-delay: .51s }
.franja:nth-child(6) { animation-delay: .60s }
@keyframes subir { to { transform: translateY(-101%); } }

/* --- Texto: cada linea sube desde detras de su propia mascara --- */
.contenido {
  position:relative; z-index:6; height:100%;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding: 0 clamp(1.5rem,5vw,5rem) clamp(3rem,9vh,6.5rem);
  max-width: 1500px; margin: 0 auto;
}

.mascara { overflow: hidden; }
.mascara > * {
  display: block;
  transform: translateY(115%);
  animation: emerger 1.15s var(--salida) forwards;
}
@keyframes emerger { to { transform: translateY(0); } }

.sello {
  font-size: .74rem; letter-spacing: .42em; text-transform: uppercase;
  color: var(--tenue); margin-bottom: 1.8rem;
}
.sello span { animation-delay: .85s }

h1 {
  font-size: clamp(2.6rem, 8.2vw, 7.5rem);
  font-weight: 200; line-height: .95; letter-spacing: -.045em;
}
h1 em { font-style: normal; font-weight: 600; }
.l1 { animation-delay: .98s }
.l2 { animation-delay: 1.08s }

/* Filo luminoso que se abre bajo el titulo */
.filo {
  height:1px; background: linear-gradient(to right, rgba(250,250,250,.9), rgba(250,250,250,0));
  margin: 2.1rem 0 1.5rem;
  transform-origin: left;
  transform: scaleX(0);
  animation: abrir 1.4s var(--salida) 1.35s forwards;
}
@keyframes abrir { to { transform: scaleX(1); } }

.pie-portada {
  display:flex; justify-content:space-between; align-items:flex-end;
  gap:2rem; flex-wrap:wrap;
  opacity:0; animation: aparecer 1.1s ease 1.6s forwards;
}
@keyframes aparecer { to { opacity:1 } }
.pie-portada p { color: var(--tenue); max-width: 44ch; font-size: clamp(.95rem,1.5vw,1.12rem); line-height:1.6; }
.pie-portada .dato { font-size:.74rem; letter-spacing:.2em; text-transform:uppercase; color:#71717a; text-align:right; }

/* --- Marca superior -------------------------------------------- */
.encabezado {
  position:absolute; top:0; left:0; right:0; z-index:7;
  display:flex; justify-content:space-between; align-items:center;
  padding: 1.6rem clamp(1.5rem,5vw,5rem);
  opacity:0; animation: aparecer 1s ease 1.75s forwards;
}
.marca { font-size:.8rem; font-weight:700; letter-spacing:.3em; }
.nav { display:flex; gap:2.2rem; font-size:.74rem; letter-spacing:.16em; text-transform:uppercase; color:var(--tenue); }
@media (max-width:760px){ .nav { display:none } }

/* --- Indicador inferior ---------------------------------------- */
.bajar {
  position:absolute; bottom:1.5rem; left:50%; z-index:7;
  transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:.6rem;
  opacity:0; animation: aparecer 1s ease 2s forwards;
}
.bajar span { font-size:.66rem; letter-spacing:.28em; text-transform:uppercase; color:#71717a; }
.riel { width:1px; height:44px; background:rgba(250,250,250,.18); position:relative; overflow:hidden; }
.riel::after {
  content:''; position:absolute; inset:0;
  background:var(--texto);
  animation: recorrer 2.1s cubic-bezier(.7,0,.3,1) infinite;
}
@keyframes recorrer {
  0%   { transform: translateY(-100%) }
  55%  { transform: translateY(0) }
  100% { transform: translateY(100%) }
}

@media (prefers-reduced-motion: reduce) {
  *, *::after { animation: none !important; }
  .franja { display:none } .mascara > * { transform:none }
  .filo { transform:scaleX(1) } .pie-portada,.encabezado,.bajar { opacity:1 }
}

/* Bloque siguiente, solo para dar contexto de scroll */
.siguiente { padding: clamp(5rem,12vh,9rem) clamp(1.5rem,5vw,5rem); max-width:1500px; margin:0 auto; }
.siguiente h2 { font-weight:200; font-size:clamp(1.8rem,4vw,3rem); letter-spacing:-.03em; }
</style>
</head>
<body>

<section class="escena">
  <div class="lienzo">
    <img src="../assets/renders/casa-will-01.webp" alt="Vivienda campestre al atardecer">
  </div>
  <div class="velo"></div>

  <div class="telon">
    <div class="franja"></div><div class="franja"></div><div class="franja"></div>
    <div class="franja"></div><div class="franja"></div><div class="franja"></div>
  </div>

  <header class="encabezado">
    <div class="marca">STICK INDUSTRIES</div>
    <nav class="nav"><a>Obra</a><a>Recorridos</a><a>Técnica</a><a>Contacto</a></nav>
  </header>

  <div class="contenido">
    <div class="sello mascara"><span>Visualización arquitectónica</span></div>
    <h1>
      <span class="mascara"><span class="l1">Antes de construirlo,</span></span>
      <span class="mascara"><em class="l2">véalo terminado.</em></span>
    </h1>
    <div class="filo"></div>
    <div class="pie-portada">
      <p>Renders y recorridos 3D para vivienda, comercio y espacios corporativos.</p>
      <div class="dato">Bucaramanga · Colombia</div>
    </div>
  </div>

  <div class="bajar"><div class="riel"></div><span>Desplace</span></div>
</section>

<section class="siguiente">
  <h2>Aquí continúa el portafolio.</h2>
</section>

</body>
</html>
